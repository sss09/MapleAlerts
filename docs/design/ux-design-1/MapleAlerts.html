<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MapleAlerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 90% at 30% 0%, #0e2a2c 0%, #0a1822 45%, #060d15 100%);
    color: #EAF1F0;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes auroraDrift0 { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.18); } }
  @keyframes auroraDrift1 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-44px,24px) scale(1); } }
  @keyframes auroraDrift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(26px,-34px) scale(1.16); } }
  @keyframes screenIn { from { transform: translateY(12px); } to { transform: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- data (plain JS, runs first) -->
  <script src="data.js"></script>

  <!-- views + shells (Babel, run in order) -->
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="sheets.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
