name: CRA Data Watch

# NOTE: the cron schedule is intentionally DISABLED. canada.ca's CDN/WAF
# silently drops HTTP from datacenter IPs (GitHub Actions runners + the local
# Dart VM both time out; only residential-IP curl reaches it). Until the fetch
# is routed through something CRA accepts (open experiment: a `curl` prefetch
# step — untested from a runner — or a residential/proxy fetch), a scheduled
# run would just open a "couldn't parse" issue every month. So this is
# manual-only (`workflow_dispatch`): run it from a network that can reach CRA,
# or after the fetch path is fixed. Re-enable the crons below once it works:
#   - cron: '0 13 1 * *'                       # monthly
#   - cron: '0 13 1,8,15,22 11,12,1,6,7 *'     # weekly in indexation windows
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Check CRA sources
        id: check
        run: |
          set +e
          dart run tool/check_data_sources.dart
          echo "code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open PR on change
        if: steps.check.outputs.code == '10'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-watch/update
          title: 'data: CRA figures changed — review before merge'
          body-path: .data-watch-summary.txt
          add-paths: web/datapack/pack.json
          commit-message: 'data: update pack.json from CRA watch'

      - name: Open issue on parse failure
        if: steps.check.outputs.code == '20'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.data-watch-summary.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'data-watch: could not parse a CRA source',
              body,
            });
